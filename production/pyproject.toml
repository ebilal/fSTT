[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fstt-priors"
version = "1.0.0"
description = "Retrieval-based keyword/keyterm predictor for Deepgram Nova-3 STT biasing"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}
dependencies = [
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fstt_priors*"]
